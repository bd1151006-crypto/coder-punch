<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高美惠 | 個人簡介</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .font-serif-tc {
            font-family: 'Noto Serif TC', serif;
        }
    </style>
</head>
<!-- 亮麗風格的漸層背景 -->
<body class="min-h-screen flex items-center justify-center p-6 bg-gradient-to-br from-yellow-300 via-pink-400 to-purple-500 antialiased">

    <!-- 簡化後的個人資訊卡片 -->
    <main class="w-full max-w-md bg-white/95 backdrop-blur-sm shadow-2xl rounded-3xl p-8 sm:p-10 text-center transform transition-all hover:-translate-y-1">
        
        <!-- 唯一的大頭貼/個人照片位置 -->
        <div class="relative w-36 h-36 mx-auto mb-6">
            <div class="w-full h-full rounded-full bg-gray-100 border-4 border-white shadow-xl flex items-center justify-center overflow-hidden">
                <!-- 提示文字：放入真實照片時，可用 <img src="imagesmyphoto.jpg"> 替換這行 span -->
                <span class="text-gray-400 text-sm font-medium">個人照片位置</span>
            </div>
            <!-- 裝飾用小圖示 -->
            <div class="absolute bottom-1 right-1 w-8 h-8 bg-yellow-400 rounded-full border-4 border-white flex items-center justify-center text-white text-xs">
                <i class="fa-solid fa-star"></i>
            </div>
        </div>

        <!-- 姓名與標題 -->
        <h1 class="text-3xl font-bold font-serif-tc text-gray-800 mb-2">高美惠</h1>
        <p class="text-pink-500 font-bold tracking-wide mb-6">黎明技術學院 數位多媒體系 ‧ 創作者</p>

        <!-- 簡短自我介紹 -->
        <p class="text-gray-600 leading-relaxed mb-8 text-sm sm:text-base">
            「簡單生活，認真對待。」<br>
            熱愛小說創作與故事企劃，用數位多媒體的視角，將生活細節轉化為充滿溫度的文字與畫面。
        </p>

        <!-- 技能標籤 -->
        <div class="flex flex-wrap justify-center gap-2 mb-8">
            <span class="px-4 py-1.5 bg-purple-100 text-purple-600 rounded-full text-xs font-bold tracking-wider">小說創作</span>
            <span class="px-4 py-1.5 bg-pink-100 text-pink-600 rounded-full text-xs font-bold tracking-wider">數位多媒體</span>
            <span class="px-4 py-1.5 bg-yellow-100 text-yellow-700 rounded-full text-xs font-bold tracking-wider">故事企劃</span>
        </div>

        <!-- 聯繫方式清單 (移除 JS 複製功能，改為直覺的按鈕) -->
        <div class="space-y-3">
            <!-- Email -->
            <a href="mailto:bd1151006@venus.lit.edu.tw" class="flex items-center justify-center gap-3 w-full py-3.5 rounded-xl bg-gray-50 text-gray-700 hover:bg-pink-500 hover:text-white transition-colors duration-300 font-medium">
                <i class="fa-regular fa-envelope text-lg"></i>
                bd1151006@venus.lit.edu.tw
            </a>
            <!-- Line ID -->
            <div class="flex items-center justify-center gap-3 w-full py-3.5 rounded-xl bg-gray-50 text-gray-700 hover:bg-green-500 hover:text-white transition-colors duration-300 font-medium cursor-default">
                <i class="fa-brands fa-line text-lg"></i>
                Line ID: punch_woimae
            </div>
            <!-- Instagram -->
            <a href="https://instagram.com/ssaithann" target="_blank" class="flex items-center justify-center gap-3 w-full py-3.5 rounded-xl bg-gray-50 text-gray-700 hover:bg-gradient-to-r hover:from-purple-500 hover:to-pink-500 hover:text-white transition-all duration-300 font-medium">
                <i class="fa-brands fa-instagram text-lg"></i>
                @ssaithann
            </a>
        </div>

    </main>
</body>
</html>
